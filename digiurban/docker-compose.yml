version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: digiurban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digiurban
      POSTGRES_PASSWORD: digiurban_dev_2025
      POSTGRES_DB: digiurban
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiurban"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digiurban

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digiurban-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000
      - DEFAULT_TENANT=default
      - LOGS_DIR=/app/logs
      - BACKUPS_DIR=/app/backups
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - USE_OLLAMA=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3.5:9b
      - OLLAMA_TIMEOUT=5000
      - AI_API_URL=http://digiurban-ai:9004/api/v1
      - AI_SERVICE_TOKEN=digiurban-ai-service-token
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      digiurban-ai:
        condition: service_healthy
    networks:
      - digiurban

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
    container_name: digiurban-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - digiurban

  # Ollama AI Service (Phi-4 para DigiBot)
  ollama:
    image: ollama/ollama:latest
    container_name: digiurban-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=-1  # Mantém modelo sempre em memória
      - OLLAMA_NUM_PARALLEL=2  # Permite 2 requisições simultâneas
      - OLLAMA_MAX_LOADED_MODELS=1  # Mantém apenas 1 modelo carregado
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - digiurban
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  # DigiUrban AI Platform (Qwen 3.5 Small 9B)
  digiurban-ai:
    build:
      context: ../digiurban-ai
      dockerfile: Dockerfile
    container_name: digiurban-ai
    ports:
      - "9004:9004"
    environment:
      - NODE_ENV=production
      - PORT=9004
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://digiurban:digiurban_dev_2025@postgres:5432/digiurban
      - CORS_ORIGIN=http://localhost:3000
      - AI_SERVICE_TOKEN=digiurban-ai-service-token
      - AI_DEFAULT_TENANT_ID=default
      - AI_OLLAMA_BASE_URL=http://ollama:11434
      - AI_OLLAMA_MODEL=qwen3.5:9b
      - AI_OLLAMA_TIMEOUT_MS=120000
      - AI_OLLAMA_TEMPERATURE=0.2
      - AI_OLLAMA_TOP_P=0.9
      - AI_OLLAMA_NUM_CTX=8192
      - AI_MAX_CONTEXT_CHUNKS=8
      - AI_MAX_CHUNK_SIZE_CHARS=1200
      - AI_CHUNK_OVERLAP_CHARS=120
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=150
      - DIGIURBAN_API_URL=http://backend:3001/api
      - DIGIURBAN_SERVICE_TOKEN=digiurban-ai-service-token
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9004/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ai_logs:/app/logs
    networks:
      - digiurban

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: digiurban-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - digiurban

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  nginx_logs:
    driver: local
  ollama_data:
    driver: local
  ai_logs:
    driver: local

networks:
  digiurban:
    driver: bridge
