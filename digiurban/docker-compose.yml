version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: digiurban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digiurban
      POSTGRES_PASSWORD: digiurban_dev_2025
      POSTGRES_DB: digiurban
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiurban"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digiurban

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digiurban-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000
      - DEFAULT_TENANT=default
      - LOGS_DIR=/app/logs
      - BACKUPS_DIR=/app/backups
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - AI_API_URL=http://digiurban-ai:9004/api/v1
      - AI_SERVICE_TOKEN=digiurban-ai-service-token
      - AI_PROXY_TIMEOUT_MS=240000
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      digiurban-ai:
        condition: service_healthy
    networks:
      - digiurban

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
    container_name: digiurban-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - digiurban

  # llama.cpp AI Service (Qwen3 1.7B)
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: digiurban-llamacpp
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - llamacpp_models:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -hf
      - ggml-org/Qwen3-1.7B-GGUF:Q4_K_M
      - --jinja
      - -c
      - "3072"
      - -n
      - "180"
      - --parallel
      - "${LLAMACPP_PARALLEL:-1}"
      - --batch-size
      - "${LLAMACPP_BATCH_SIZE:-512}"
      - --ubatch-size
      - "${LLAMACPP_UBATCH_SIZE:-128}"
      - --threads
      - "${LLAMACPP_THREADS:-4}"
    networks:
      - digiurban
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  # DigiUrban AI Platform (llama.cpp + Qwen3 1.7B)
  digiurban-ai:
    build:
      context: ../digiurban-ai
      dockerfile: Dockerfile
    container_name: digiurban-ai
    ports:
      - "9004:9004"
    environment:
      - NODE_ENV=production
      - PORT=9004
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://digiurban:digiurban_dev_2025@postgres:5432/digiurban
      - CORS_ORIGIN=http://localhost:3000
      - AI_SERVICE_TOKEN=digiurban-ai-service-token
      - AI_DEFAULT_TENANT_ID=default
      - AI_LLAMACPP_BASE_URL=http://llamacpp:8080
      - AI_LLAMACPP_MODEL=qwen3-1.7b-instruct-q4_k_m
      - AI_LLAMACPP_TIMEOUT_MS=90000
      - AI_LLAMACPP_FAST_TIMEOUT_MS=45000
      - AI_LLAMACPP_NUM_CTX=3072
      - AI_LLAMACPP_RAG_NUM_CTX=2304
      - AI_LLAMACPP_MAX_TOKENS=180
      - AI_LLAMACPP_RAG_MAX_TOKENS=110
      - AI_LLAMACPP_FAST_MAX_TOKENS=64
      - AI_LLAMACPP_TOOL_LOOP_MAX_STEPS=3
      - AI_LLAMACPP_WARMUP_ENABLED=true
      - "AI_LLAMACPP_WARMUP_PROMPT=Responda apenas: ok"
      - AI_LLAMACPP_THINKING_DEFAULT=false
      - AI_LLAMACPP_NO_THINK_PROMPT_SWITCH=true
      - AI_WEB_SEARCH_ENABLED=true
      - AI_WEB_SEARCH_DEFAULT=false
      - AI_WEB_SEARCH_PROVIDER=duckduckgo
      - AI_WEB_SEARCH_TIMEOUT_MS=12000
      - AI_WEB_SEARCH_MAX_RESULTS=5
      - AI_WEB_SEARCH_CACHE_TTL_MS=300000
      - AI_MAX_CONTEXT_CHUNKS=3
      - AI_MAX_CONVERSATION_MESSAGES_CONTEXT=6
      - AI_MAX_CONTEXT_CHARS_IN_PROMPT=1200
      - AI_MAX_CHUNK_SIZE_CHARS=1200
      - AI_CHUNK_OVERLAP_CHARS=120
      - AI_MAX_MODEL_MESSAGE_CHARS=900
      - AI_RAG_CANDIDATE_LIMIT=120
      - AI_RAG_SEMANTIC_WEIGHT=0.65
      - AI_RAG_LEXICAL_WEIGHT=0.35
      - AI_RAG_QUERY_CACHE_TTL_MS=120000
      - AI_EMBEDDINGS_ENABLED=false
      - AI_EMBEDDINGS_BASE_URL=http://llamacpp:8080
      - AI_EMBEDDINGS_MODEL=nomic-embed-text-v1.5
      - AI_EMBEDDINGS_TIMEOUT_MS=15000
      - AI_EMBEDDINGS_BATCH_SIZE=12
      - AI_EMBEDDINGS_QUERY_CACHE_TTL_MS=300000
      - AI_SEMANTIC_CACHE_ENABLED=true
      - AI_SEMANTIC_CACHE_SIMILARITY_THRESHOLD=0.92
      - AI_SEMANTIC_CACHE_MAX_CANDIDATES=240
      - AI_SEMANTIC_CACHE_TTL_DAYS=30
      - AI_SEMANTIC_CACHE_MAX_RESPONSE_CHARS=1800
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=150
      - DIGIURBAN_API_URL=http://backend:3001/api
      - DIGIURBAN_SERVICE_TOKEN=digiurban-ai-service-token
    depends_on:
      postgres:
        condition: service_healthy
      llamacpp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9004/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ai_logs:/app/logs
    networks:
      - digiurban

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: digiurban-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - digiurban

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  nginx_logs:
    driver: local
  llamacpp_models:
    driver: local
  ai_logs:
    driver: local

networks:
  digiurban:
    driver: bridge
