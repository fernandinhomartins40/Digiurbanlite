[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[program:backend]
command=node /app/backend/dist/index.js
directory=/app/backend
user=backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="%(ENV_NODE_ENV)s",PORT="%(ENV_PORT)s",DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET="%(ENV_JWT_SECRET)s",JWT_EXPIRES_IN="%(ENV_JWT_EXPIRES_IN)s",JWT_ADMIN_EXPIRES_IN="%(ENV_JWT_ADMIN_EXPIRES_IN)s",JWT_CITIZEN_EXPIRES_IN="%(ENV_JWT_CITIZEN_EXPIRES_IN)s",FRONTEND_URL="%(ENV_FRONTEND_URL)s",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s",ALLOWED_ORIGINS="%(ENV_ALLOWED_ORIGINS)s",DEFAULT_TENANT="%(ENV_DEFAULT_TENANT)s"
startsecs=5
startretries=5
stopwaitsecs=10
killasgroup=true
stopasgroup=true

[program:frontend]
command=npx next start -p 3000 -H 0.0.0.0
directory=/app/frontend
user=frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="%(ENV_NODE_ENV)s",PORT="3000",HOSTNAME="0.0.0.0"
startsecs=10
startretries=3

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=900
