user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Upstream Backend (porta interna 3001)
    upstream backend {
        server 127.0.0.1:3001;
    }

    # Upstream Frontend (porta interna 3000)
    upstream frontend {
        server 127.0.0.1:3000;
    }

    # Upstream ultrazend-messages (porta 9001 no host, via network)
    upstream messages {
        server ultrazend-messages:9001;
    }

    server {
        listen 80;
        server_name www.digiurban.com.br digiurban.com.br _;

        # Health check
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Socket.IO - Requisições WebSocket (DEVE VIR ANTES DE /api/)
        location /api/socket/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers para WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers padrão
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts para conexões longas (WebSocket)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 300s;

            # Sem cache para WebSocket
            proxy_buffering off;
            proxy_cache_bypass 1;
        }

        # Download de documentos - SEM cache-control restritivo
        location ~ ^/api/protocols/.*/documents/.*/download {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Permitir cache para documentos (1 hora)
            add_header Cache-Control "public, max-age=3600";

            # Timeouts maiores para downloads grandes
            proxy_read_timeout 600s;
            proxy_connect_timeout 300s;

            # Buffering para melhor performance em downloads
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ========== ULTRAZEND-MESSAGES API ==========
        # WebSocket do Socket.IO (DEVE VIR ANTES DE /messages-api/)
        location /socket.io/ {
            proxy_pass http://messages;
            proxy_http_version 1.1;

            # Headers para WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers padrão
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # IMPORTANTE: Passar cookies para autenticação WebSocket
            proxy_set_header Cookie $http_cookie;

            # Timeouts para conexões longas (WebSocket)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 300s;

            # Sem cache para WebSocket
            proxy_buffering off;
            proxy_cache_bypass 1;
        }

        # API REST do ultrazend-messages
        location /messages-api/ {
            proxy_pass http://messages/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # IMPORTANTE: Passar cookies para autenticação
            proxy_set_header Cookie $http_cookie;

            # DESABILITAR CACHE
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";

            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # API Backend (rotas REST normais)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # DESABILITAR COMPLETAMENTE O CACHE PARA API
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";

            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # Upload de arquivos
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend Next.js (todas as outras rotas)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
    }
}
