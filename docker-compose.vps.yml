services:
  postgres:
    image: postgres:15-alpine
    container_name: digiurban-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiurban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiurban2024}
      POSTGRES_DB: ${POSTGRES_DB:-digiurban}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - digiurban_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digiurban}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digiurban-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - digiurban_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ultrazend-smtp:
    build:
      context: ./ultrazend-smtp-server
      dockerfile: Dockerfile
    container_name: ultrazend-smtp
    ports:
      - "25:25"     # MX Server (receber emails externos)
      - "587:587"   # Submission Server (enviar emails autenticados)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOSTNAME=mail.digiurban.com.br
      - MX_PORT=25
      - SUBMISSION_PORT=587
    volumes:
      - smtp_data:/app/data
      - smtp_logs:/app/logs
      - digiurban_uploads:/app/uploads:ro  # ← Compartilhar uploads (read-only)
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(587, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: digiurban-llamacpp
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - llamacpp_models:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/digibot-q4_k_m.gguf
      - --jinja
      - -c
      - "2048"
      - -n
      - "120"
      - --parallel
      - "${LLAMACPP_PARALLEL:-1}"
      - --batch-size
      - "${LLAMACPP_BATCH_SIZE:-512}"
      - --ubatch-size
      - "${LLAMACPP_UBATCH_SIZE:-512}"
      - --threads
      - "${LLAMACPP_THREADS:-4}"
      - --threads-batch
      - "${LLAMACPP_THREADS_BATCH:-4}"
      - -fa
      - "on"
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  ultrazend-messages:
    build:
      context: ./ultrazend-messages-server
      dockerfile: Dockerfile
    container_name: ultrazend-messages
    ports:
      - "9001:9001"  # WebSocket + HTTP API
    environment:
      - NODE_ENV=production
      - PORT=9001
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      # MESSAGE_SERVER_ID removido - busca dinâmica no código
      - MESSAGES_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}
      - CITIZEN_AI_COMPLETIONS_URL=http://digiurban-ai:9004/api/v1/internal/chat/completions
      - CITIZEN_AI_TENANT_ID=${AI_DEFAULT_TENANT_ID:-default}
      - DIGIBOT_INACTIVITY_TIMEOUT_MS=${DIGIBOT_INACTIVITY_TIMEOUT_MS:-600000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - BASE_URL=https://digiurban.com.br
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - MESSAGE_RATE_LIMIT_PER_MINUTE=30
      - LOG_LEVEL=info
    volumes:
      - messages_uploads:/app/uploads
      - messages_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # MÓDULO: digiurban-prices — Pesquisa de Preços Públicos
  # ─────────────────────────────────────────────────────────────
  # CompreFace removido: reconhecimento facial usa face-api.js no browser
  # + cosine similarity no PostgreSQL. Não há chamadas ao CompreFace no código.

  ultrazend-face:
    build:
      context: ./ultrazend-face-server
      dockerfile: Dockerfile
    container_name: ultrazend-face
    ports:
      - "9006:9006"
    environment:
      - NODE_ENV=production
      - PORT=9006
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - FACE_PLATFORM_SERVICE_TOKEN=${FACE_PLATFORM_SERVICE_TOKEN:-ultrazend-face-service-token}
      - FACE_PLATFORM_STORAGE_PATH=/app/uploads/face-platform
      - COMPREFACE_API_URL=
      - COMPREFACE_API_KEY=
      - FACE_LIVENESS_PROVIDER=${FACE_LIVENESS_PROVIDER:-guided-live-session}
      - SILENT_FACE_LIVENESS_API_URL=${SILENT_FACE_LIVENESS_API_URL:-}
      - SILENT_FACE_LIVENESS_API_TOKEN=${SILENT_FACE_LIVENESS_API_TOKEN:-}
      - FACE_REQUIRE_SERVER_LIVENESS=${FACE_REQUIRE_SERVER_LIVENESS:-false}
      - FACE_LIVENESS_TIMEOUT_MS=${FACE_LIVENESS_TIMEOUT_MS:-12000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - UPLOAD_DIR=/app/uploads
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=300
      - LOG_LEVEL=info
    volumes:
      - face_uploads:/app/uploads
      - face_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9006/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # digiurban-opensearch: disabled (Pesquisa de Preços)
  # digiurban-prices: disabled (Pesquisa de Preços)
  # digiurban-flow: disabled (Processos Internos)

  # ─────────────────────────────────────────────────────────────
  # MÓDULO: digiurban-ai — Plataforma de IA Centralizada (llama.cpp + Qwen3 1.7B)
  # ─────────────────────────────────────────────────────────────
  digiurban-ai:
    build:
      context: ./digiurban-ai
      dockerfile: Dockerfile
    container_name: digiurban-ai
    ports:
      - "9004:9004"
    environment:
      - NODE_ENV=production
      - PORT=9004
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}
      - AI_DEFAULT_TENANT_ID=${AI_DEFAULT_TENANT_ID:-default}
      - AI_LLAMACPP_BASE_URL=http://llamacpp:8080
      - AI_LLAMACPP_MODEL=${AI_LLAMACPP_MODEL:-digibot-q4_k_m.gguf}
      - AI_LLAMACPP_TIMEOUT_MS=60000
      - AI_LLAMACPP_FAST_TIMEOUT_MS=30000
      - AI_LLAMACPP_TEMPERATURE=0.1
      - AI_LLAMACPP_TOP_P=0.9
      - AI_LLAMACPP_NUM_CTX=2048
      - AI_LLAMACPP_RAG_NUM_CTX=2048
      - AI_LLAMACPP_MAX_TOKENS=120
      - AI_LLAMACPP_RAG_MAX_TOKENS=80
      - AI_LLAMACPP_FAST_MAX_TOKENS=48
      - AI_LLAMACPP_TOOL_LOOP_MAX_STEPS=3
      - AI_LLAMACPP_WARMUP_ENABLED=true
      - "AI_LLAMACPP_WARMUP_PROMPT=Responda apenas: ok"
      - AI_LLAMACPP_THINKING_DEFAULT=${AI_LLAMACPP_THINKING_DEFAULT:-false}
      - AI_LLAMACPP_NO_THINK_PROMPT_SWITCH=${AI_LLAMACPP_NO_THINK_PROMPT_SWITCH:-true}
      - AI_WEB_SEARCH_ENABLED=true
      - AI_WEB_SEARCH_DEFAULT=false
      - AI_WEB_SEARCH_PROVIDER=duckduckgo
      - AI_WEB_SEARCH_TIMEOUT_MS=12000
      - AI_WEB_SEARCH_MAX_RESULTS=5
      - AI_WEB_SEARCH_CACHE_TTL_MS=300000
      - AI_MAX_CONTEXT_CHUNKS=3
      - AI_MAX_CONVERSATION_MESSAGES_CONTEXT=6
      - AI_MAX_CHUNK_SIZE_CHARS=1200
      - AI_CHUNK_OVERLAP_CHARS=120
      - AI_MAX_CONTEXT_CHARS_IN_PROMPT=1200
      - AI_MAX_MODEL_MESSAGE_CHARS=900
      - AI_RAG_CANDIDATE_LIMIT=120
      - AI_RAG_SEMANTIC_WEIGHT=0.65
      - AI_RAG_LEXICAL_WEIGHT=0.35
      - AI_RAG_QUERY_CACHE_TTL_MS=120000
      - AI_EMBEDDINGS_ENABLED=${AI_EMBEDDINGS_ENABLED:-false}
      - AI_EMBEDDINGS_BASE_URL=${AI_EMBEDDINGS_BASE_URL:-http://llamacpp:8080}
      - AI_EMBEDDINGS_MODEL=${AI_EMBEDDINGS_MODEL:-nomic-embed-text-v1.5}
      - AI_EMBEDDINGS_TIMEOUT_MS=15000
      - AI_EMBEDDINGS_BATCH_SIZE=12
      - AI_EMBEDDINGS_QUERY_CACHE_TTL_MS=300000
      - AI_SEMANTIC_CACHE_ENABLED=${AI_SEMANTIC_CACHE_ENABLED:-true}
      - AI_SEMANTIC_CACHE_SIMILARITY_THRESHOLD=${AI_SEMANTIC_CACHE_SIMILARITY_THRESHOLD:-0.92}
      - AI_SEMANTIC_CACHE_MAX_CANDIDATES=${AI_SEMANTIC_CACHE_MAX_CANDIDATES:-240}
      - AI_SEMANTIC_CACHE_TTL_DAYS=${AI_SEMANTIC_CACHE_TTL_DAYS:-30}
      - AI_SEMANTIC_CACHE_MAX_RESPONSE_CHARS=${AI_SEMANTIC_CACHE_MAX_RESPONSE_CHARS:-1800}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=150
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
    volumes:
      - ai_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llamacpp:
        condition: service_started
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9004/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  digiurban:
    build:
      context: .
      dockerfile: digiurban/Dockerfile
      args:
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-0}
        - CACHE_BUST=${CACHE_BUST:-0}
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
        - NEXT_PUBLIC_MESSAGES_API_URL=${NEXT_PUBLIC_MESSAGES_API_URL:-/messages-api}
        - NEXT_PUBLIC_MESSAGES_WS_URL=${NEXT_PUBLIC_MESSAGES_WS_URL:-wss://digiurban.com.br}
    container_name: digiurban-vps
    ports:
      - "3060:80"   # Porta EXTERNA 3060 -> Porta INTERNA 80 (Nginx)
    environment:
      # Node.js
      - NODE_ENV=production

      # Backend (porta interna 3001)
      - PORT=3001
      - BACKEND_PORT=3001

      # Frontend (porta interna 3000)
      - FRONTEND_PORT=3000
      # NEXT_PUBLIC_API_URL é setado em BUILD TIME no Dockerfile (linha 40)

      # Build timestamp for cache busting
      - BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-0}

      # Database PostgreSQL
      - DATABASE_URL=${DATABASE_URL}

      # Redis
      - REDIS_URL=redis://redis:6379

      # JWT
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      - JWT_ADMIN_EXPIRES_IN=8h
      - JWT_CITIZEN_EXPIRES_IN=30d

      # CORS (ambos domínios com e sem www)
      - FRONTEND_URL=https://digiurban.com.br
      - CORS_ORIGIN=https://digiurban.com.br
      - ALLOWED_ORIGINS=https://www.digiurban.com.br,https://digiurban.com.br,http://www.digiurban.com.br,http://digiurban.com.br,http://72.60.10.108:3060,http://localhost:3060

      # Tenants
      - DEFAULT_TENANT=demo

      # Service Token (para Messages Server)
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - FACE_PLATFORM_API_URL=${FACE_PLATFORM_API_URL:-http://ultrazend-face:9006}
      - FACE_PLATFORM_SERVICE_TOKEN=${FACE_PLATFORM_SERVICE_TOKEN:-ultrazend-face-service-token}

      # Logs
      - LOG_LEVEL=info
      - LOGS_DIR=/app/logs

      # Uploads
      - UPLOAD_BASE_PATH=/app/uploads

      # Backups
      - BACKUPS_DIR=/app/backups

      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

      # Módulo de IA Centralizada (proxy interno)
      - AI_API_URL=http://digiurban-ai:9004/api/v1
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}
      - AI_PROXY_TIMEOUT_MS=90000

    volumes:
      - digiurban_uploads:/app/uploads
      - digiurban_logs:/app/logs
      - digiurban_backups:/app/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ultrazend-smtp:
        condition: service_healthy
      ultrazend-messages:
        condition: service_healthy
      ultrazend-face:
        condition: service_started
      digiurban-ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - digiurban_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  llamacpp_models:
    driver: local
  digiurban_uploads:
    driver: local
  digiurban_logs:
    driver: local
  digiurban_backups:
    driver: local
  smtp_data:
    driver: local
  smtp_logs:
    driver: local
  messages_uploads:
    driver: local
  messages_logs:
    driver: local
  face_uploads:
    driver: local
  face_logs:
    driver: local
  # opensearch_data: removed (Pesquisa de Preços)
  # prices_uploads: removed (Pesquisa de Preços)
  # flow_uploads: removed (Processos Internos)
  # flow_logs: removed (Processos Internos)
  ai_logs:
    driver: local

networks:
  digiurban_network:
    driver: bridge
