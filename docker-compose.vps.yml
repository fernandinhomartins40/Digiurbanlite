services:
  postgres:
    image: postgres:15-alpine
    container_name: digiurban-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiurban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiurban2024}
      POSTGRES_DB: ${POSTGRES_DB:-digiurban}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - digiurban_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digiurban}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digiurban-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - digiurban_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ultrazend-smtp:
    build:
      context: ./ultrazend-smtp-server
      dockerfile: Dockerfile
    container_name: ultrazend-smtp
    ports:
      - "25:25"     # MX Server (receber emails externos)
      - "587:587"   # Submission Server (enviar emails autenticados)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOSTNAME=mail.digiurban.com.br
      - MX_PORT=25
      - SUBMISSION_PORT=587
    volumes:
      - smtp_data:/app/data
      - smtp_logs:/app/logs
      - digiurban_uploads:/app/uploads:ro  # ← Compartilhar uploads (read-only)
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(587, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: digiurban-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=-1  # Mantém modelo sempre em memória
      - OLLAMA_NUM_PARALLEL=2  # Permite 2 requisições simultâneas
      - OLLAMA_MAX_LOADED_MODELS=1  # Mantém apenas 1 modelo carregado
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - digiurban_network
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  ultrazend-messages:
    build:
      context: ./ultrazend-messages-server
      dockerfile: Dockerfile
    container_name: ultrazend-messages
    ports:
      - "9001:9001"  # WebSocket + HTTP API
    environment:
      - NODE_ENV=production
      - PORT=9001
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      # MESSAGE_SERVER_ID removido - busca dinâmica no código
      - MESSAGES_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - BASE_URL=https://digiurban.com.br
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - MESSAGE_RATE_LIMIT_PER_MINUTE=30
      - LOG_LEVEL=info
    volumes:
      - messages_uploads:/app/uploads
      - messages_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # MÓDULO: digiurban-prices — Pesquisa de Preços Públicos
  # ─────────────────────────────────────────────────────────────
  digiurban-opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: digiurban-opensearch
    environment:
      - cluster.name=digiurban-prices-cluster
      - node.name=prices-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_PATH_TMP=/tmp
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-D1g1Urb@nPr1c3s!2026}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: unless-stopped
    networks:
      - digiurban_network
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 180s

  digiurban-prices:
    build:
      context: ./digiurban-prices
      dockerfile: Dockerfile
    container_name: digiurban-prices
    ports:
      - "9002:9002"
    environment:
      - NODE_ENV=production
      - PORT=9002
      - DATABASE_URL=${DATABASE_URL}
      - OPENSEARCH_URL=http://digiurban-opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - DIGIURBAN_API_KEY=${DIGIURBAN_API_KEY:-digiurban-prices-api-key-change-me}
      - TRANSPARENCIA_API_KEY=${TRANSPARENCIA_API_KEY:-8dfd3c591d9b5d621df99916932567d3}
      - COMPRASNET_BASE_URL=https://pncp.gov.br/api/consulta/v1
      - PNCP_BASE_URL=https://pncp.gov.br/api/consulta/v1
      - INGEST_SINCE_DAYS=1825
      - BPS_MAX_FILES_PER_RUN=6
      - PNCP_MAX_PAGES_CONTRATACOES=500
      - PNCP_MAX_PAGES_CONTRATOS=300
      - CATMAT_AUTO_CLASSIFY_ENABLED=true
      - CATMAT_AUTO_CLASSIFY_MIN_SCORE=0.55
      - CATMAT_AUTO_CLASSIFY_MAX_CANDIDATES=80
      - INGEST_CRON=0 2 * * *
      - OUTLIER_METHOD=IQR
      - OUTLIER_IQR_K=1.5
      - LOG_LEVEL=info
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - prices_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      digiurban-opensearch:
        condition: service_started
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ─────────────────────────────────────────────────────────────
  # MÓDULO: digiurban-flow — Motor de Processos Internos
  # ─────────────────────────────────────────────────────────────
  digiurban-flow:
    build:
      context: ./digiurban-flow
      dockerfile: Dockerfile
    container_name: digiurban-flow
    ports:
      - "9003:9003"
    environment:
      - NODE_ENV=production
      - PORT=9003
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - FLOW_SERVICE_TOKEN=${FLOW_SERVICE_TOKEN:-digiurban-flow-service-token}
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - SLA_CHECK_INTERVAL_MS=300000
      - LOG_LEVEL=info
    volumes:
      - flow_uploads:/app/uploads
      - flow_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9003/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ─────────────────────────────────────────────────────────────
  # MÓDULO: digiurban-ai — Plataforma de IA Centralizada (Qwen 3.5 9B)
  # ─────────────────────────────────────────────────────────────
  digiurban-ai:
    build:
      context: ./digiurban-ai
      dockerfile: Dockerfile
    container_name: digiurban-ai
    ports:
      - "9004:9004"
    environment:
      - NODE_ENV=production
      - PORT=9004
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}
      - AI_DEFAULT_TENANT_ID=${AI_DEFAULT_TENANT_ID:-default}
      - AI_OLLAMA_BASE_URL=http://ollama:11434
      - AI_OLLAMA_MODEL=${AI_OLLAMA_MODEL:-qwen3.5:9b}
      - AI_OLLAMA_TIMEOUT_MS=120000
      - AI_OLLAMA_TEMPERATURE=0.2
      - AI_OLLAMA_TOP_P=0.9
      - AI_OLLAMA_NUM_CTX=8192
      - AI_MAX_CONTEXT_CHUNKS=8
      - AI_MAX_CHUNK_SIZE_CHARS=1200
      - AI_CHUNK_OVERLAP_CHARS=120
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=150
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
    volumes:
      - ai_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9004/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  digiurban:
    build:
      context: .
      dockerfile: digiurban/Dockerfile
      args:
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-0}
        - CACHE_BUST=${CACHE_BUST:-0}
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
        - NEXT_PUBLIC_MESSAGES_API_URL=${NEXT_PUBLIC_MESSAGES_API_URL:-/messages-api}
        - NEXT_PUBLIC_MESSAGES_WS_URL=${NEXT_PUBLIC_MESSAGES_WS_URL:-wss://digiurban.com.br}
    container_name: digiurban-vps
    ports:
      - "3060:80"   # Porta EXTERNA 3060 -> Porta INTERNA 80 (Nginx)
    environment:
      # Node.js
      - NODE_ENV=production

      # Backend (porta interna 3001)
      - PORT=3001
      - BACKEND_PORT=3001

      # Frontend (porta interna 3000)
      - FRONTEND_PORT=3000
      # NEXT_PUBLIC_API_URL é setado em BUILD TIME no Dockerfile (linha 40)

      # Build timestamp for cache busting
      - BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-0}

      # Database PostgreSQL
      - DATABASE_URL=${DATABASE_URL}

      # Redis
      - REDIS_URL=redis://redis:6379

      # JWT
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      - JWT_ADMIN_EXPIRES_IN=8h
      - JWT_CITIZEN_EXPIRES_IN=30d

      # CORS (ambos domínios com e sem www)
      - FRONTEND_URL=https://digiurban.com.br
      - CORS_ORIGIN=https://digiurban.com.br
      - ALLOWED_ORIGINS=https://www.digiurban.com.br,https://digiurban.com.br,http://www.digiurban.com.br,http://digiurban.com.br,http://72.60.10.108:3060,http://localhost:3060

      # Tenants
      - DEFAULT_TENANT=demo

      # Service Token (para Messages Server)
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}

      # Logs
      - LOG_LEVEL=info
      - LOGS_DIR=/app/logs

      # Uploads
      - UPLOAD_BASE_PATH=/app/uploads

      # Backups
      - BACKUPS_DIR=/app/backups

      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

      # Ollama AI (DigiBot Enhanced)
      - USE_OLLAMA=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${AI_OLLAMA_MODEL:-qwen3.5:9b}
      - OLLAMA_TIMEOUT=15000

      # Módulo de Preços (proxy interno)
      - PRICES_API_URL=http://digiurban-prices:9002/api/v1
      - DIGIURBAN_API_KEY=${DIGIURBAN_API_KEY:-digiurban-prices-api-key-change-me}

      # Módulo de Processos Internos (proxy interno)
      - FLOW_API_URL=http://digiurban-flow:9003/api/v1
      - FLOW_SERVICE_TOKEN=${FLOW_SERVICE_TOKEN:-digiurban-flow-service-token}

      # Módulo de IA Centralizada (proxy interno)
      - AI_API_URL=http://digiurban-ai:9004/api/v1
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}

    volumes:
      - digiurban_uploads:/app/uploads
      - digiurban_logs:/app/logs
      - digiurban_backups:/app/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ultrazend-smtp:
        condition: service_healthy
      ultrazend-messages:
        condition: service_healthy
      ollama:
        condition: service_healthy
      digiurban-prices:
        condition: service_started
      digiurban-flow:
        condition: service_started
      digiurban-ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - digiurban_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  digiurban_uploads:
    driver: local
  digiurban_logs:
    driver: local
  digiurban_backups:
    driver: local
  smtp_data:
    driver: local
  smtp_logs:
    driver: local
  messages_uploads:
    driver: local
  messages_logs:
    driver: local
  opensearch_data:
    driver: local
  prices_uploads:
    driver: local
  flow_uploads:
    driver: local
  flow_logs:
    driver: local
  ai_logs:
    driver: local

networks:
  digiurban_network:
    driver: bridge
