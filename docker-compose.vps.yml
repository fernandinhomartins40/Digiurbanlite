services:
  postgres:
    image: postgres:15-alpine
    container_name: digiurban-postgres
    # Otimizacao VPS (2026-09-14): SEM isto o driver json-file cresce ILIMITADO
    # ate encher o disco (a VPS esta a 84%). 3 arquivos x 10MB = teto de 30MB/container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Otimização VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P1-1): VPS COMPARTILHADA com ~30
    # aplicações — sem mem_limit um vazamento aqui derruba as outras. Valor = ~3x o
    # consumo MEDIDO (198 MiB) em produção, com folga para cache do banco (3.4 GB de dados).
    mem_limit: 512m
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1): `mem_limit` impedia que a app
    # comesse toda a RAM, mas NADA impedia que consumisse os 4 vCPU da VPS compartilhada
    # — que foi o incidente que motivou esta auditoria. `cpus` e TETO, nao reserva: a soma
    # dos tetos (6.0) excede os 4 vCPU de proposito, para nao particionar a maquina.
    # Justificativa deste valor: banco; CPU medido 0.00% — teto protege contra query descontrolada.
    # `pids_limit` barra fork bomb / vazamento de processos.
    cpus: 1.0
    pids_limit: 256
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1c): o `mem_limit: 512m` acima foi
    # definido SEM tuning do Postgres, que continuava nos defaults. Isso e perigoso: se
    # shared_buffers + (work_mem x max_connections) ultrapassar o mem_limit, o OOM killer
    # derruba o banco sob carga. Valores abaixo dimensionados PARA o limite de 512m:
    #   shared_buffers 128m  = 25% do mem_limit (regra usual)
    #   max_connections 50   = teto real; o backend usa 1 pool (apos o fix C2) e os 3
    #                          satelites usam pools pequenos. O default 100 nunca foi
    #                          atingido por uso legitimo — foi atingido pelo VAZAMENTO.
    #   work_mem 4m          = (512-128) / (50 x ~2) com folga
    #   effective_cache_size 256m = metade do limite (o cache do SO e compartilhado)
    # MEDIDO: consumo real era 198 MiB. Estes valores mantem folga sobre isso.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiurban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiurban2024}
      POSTGRES_DB: ${POSTGRES_DB:-digiurban}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - digiurban_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digiurban}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digiurban-redis
    # Otimizacao VPS (2026-09-14): SEM isto o driver json-file cresce ILIMITADO
    # ate encher o disco (a VPS esta a 84%). 3 arquivos x 10MB = teto de 30MB/container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Otimização VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P1-1): VPS COMPARTILHADA com ~30
    # aplicações — sem mem_limit um vazamento aqui derruba as outras. Valor = ~3x o
    # consumo MEDIDO (~20 MiB) em produção, com folga para as filas BullMQ.
    mem_limit: 192m
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1): `mem_limit` impedia que a app
    # comesse toda a RAM, mas NADA impedia que consumisse os 4 vCPU da VPS compartilhada
    # — que foi o incidente que motivou esta auditoria. `cpus` e TETO, nao reserva: a soma
    # dos tetos (6.0) excede os 4 vCPU de proposito, para nao particionar a maquina.
    # Justificativa deste valor: cache/filas; consumo irrisorio (~20 MiB).
    # `pids_limit` barra fork bomb / vazamento de processos.
    cpus: 0.5
    pids_limit: 128
    # Otimização VPS (P1-4): Redis NÃO precisa de porta pública — só é acessado pelo
    # backend e pelo messages-server dentro da rede digiurban_network. Expor 6379 numa
    # VPS compartilhada era superfície de ataque desnecessária.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - digiurban_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  ultrazend-smtp:
    # Otimizacao VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P0-4): a imagem vem PRONTA do
    # GHCR, construida pelo GitHub Actions. A VPS so faz `pull`. O bloco `build`
    # permanece apenas como fallback manual (docker compose build) em emergencia.
    image: ghcr.io/fernandinhomartins40/digiurban-smtp:${RELEASE:-latest}
    build:
      context: ./ultrazend-smtp-server
      dockerfile: Dockerfile
    container_name: ultrazend-smtp
    # Otimizacao VPS (2026-09-14): SEM isto o driver json-file cresce ILIMITADO
    # ate encher o disco (a VPS esta a 84%). 3 arquivos x 10MB = teto de 30MB/container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Otimização VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P1-1): VPS COMPARTILHADA com ~30
    # aplicações — sem mem_limit um vazamento aqui derruba as outras. Valor = ~3x o
    # consumo NÃO MEDIDO (container em crash-loop) — revisar após o fix do P0-2.
    mem_limit: 384m
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1): `mem_limit` impedia que a app
    # comesse toda a RAM, mas NADA impedia que consumisse os 4 vCPU da VPS compartilhada
    # — que foi o incidente que motivou esta auditoria. `cpus` e TETO, nao reserva: a soma
    # dos tetos (6.0) excede os 4 vCPU de proposito, para nao particionar a maquina.
    # Justificativa deste valor: SMTP e I/O-bound; CPU NAO MEDIDO (estava em crash-loop).
    # `pids_limit` barra fork bomb / vazamento de processos.
    cpus: 0.5
    pids_limit: 128
    ports:
      - "25:25"     # MX Server (receber emails externos)
      - "587:587"   # Submission Server (enviar emails autenticados)
    environment:
      - NODE_ENV=production
      # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1b): este era o UNICO servico Node
      # sem teto de heap do V8 — lacuna encontrada ao conferir o dimensionamento contra a
      # pratica corrente (heap = 60-75% do mem_limit). Sem isto o V8 cresce ate bater no
      # mem_limit e o container morre por OOM em vez de fazer GC. 256m / 384m = 66%.
      - NODE_OPTIONS=--max-old-space-size=256
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOSTNAME=mail.digiurban.com.br
      - MX_PORT=25
      - SUBMISSION_PORT=587
    volumes:
      - smtp_data:/app/data
      - smtp_logs:/app/logs
      - digiurban_uploads:/app/uploads:ro  # ← Compartilhar uploads (read-only)
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(587, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ultrazend-messages:
    # Otimizacao VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P0-4): a imagem vem PRONTA do
    # GHCR, construida pelo GitHub Actions. A VPS so faz `pull`. O bloco `build`
    # permanece apenas como fallback manual (docker compose build) em emergencia.
    image: ghcr.io/fernandinhomartins40/digiurban-messages:${RELEASE:-latest}
    build:
      context: ./ultrazend-messages-server
      dockerfile: Dockerfile
    container_name: ultrazend-messages
    # Otimizacao VPS (2026-09-14): SEM isto o driver json-file cresce ILIMITADO
    # ate encher o disco (a VPS esta a 84%). 3 arquivos x 10MB = teto de 30MB/container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Otimização VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P1-1): VPS COMPARTILHADA com ~30
    # aplicações — sem mem_limit um vazamento aqui derruba as outras. Valor = ~3x o
    # consumo MEDIDO (60 MiB) em produção, com folga para picos fora do heap (Sharp/Chromium).
    mem_limit: 384m
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1): `mem_limit` impedia que a app
    # comesse toda a RAM, mas NADA impedia que consumisse os 4 vCPU da VPS compartilhada
    # — que foi o incidente que motivou esta auditoria. `cpus` e TETO, nao reserva: a soma
    # dos tetos (6.0) excede os 4 vCPU de proposito, para nao particionar a maquina.
    # Justificativa deste valor: WebSocket + Sharp; CPU medido 0.00%.
    # `pids_limit` barra fork bomb / vazamento de processos.
    cpus: 1.0
    pids_limit: 256
    ports:
      - "9001:9001"  # WebSocket + HTTP API
    environment:
      - NODE_ENV=production
      - PORT=9001
      # Otimização VPS (P1-2): heap do V8 ABAIXO do mem_limit, deixando margem para
      # memória fora do heap (Sharp, buffers, Chromium). Sem isto o V8 cresce até
      # bater no limite do container e morrer por OOM em vez de fazer GC.
      - NODE_OPTIONS=--max-old-space-size=256
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      # MESSAGE_SERVER_ID removido - busca dinâmica no código
      - MESSAGES_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      # Multi-tenant (plano 2026-07-13): fallback do seeder de fluxos e do
      # resolveTenantId quando não há claim/contexto (deve casar com a linha
      # 'tenant-default' criada pela migration add_tenants_table).
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-tenant-default}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}
      # IA LOCAL REMOVIDA (2026-09-14): llamacpp e digiurban-ai sairam do compose.
      # A IA passa a ser externa (API DeepSeek, com creditos por municipio).
      # Enquanto a integracao nao entra, o chat com IA fica INDISPONIVEL --
      # estas URLs apontam para um servico que nao existe mais.
      # - CITIZEN_AI_COMPLETIONS_URL=http://digiurban-ai:9004/api/v1/internal/chat/completions
      - CITIZEN_AI_TENANT_ID=${AI_DEFAULT_TENANT_ID:-default}
      - DIGIBOT_INACTIVITY_TIMEOUT_MS=${DIGIBOT_INACTIVITY_TIMEOUT_MS:-600000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - BASE_URL=https://digiurban.com.br
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - MESSAGE_RATE_LIMIT_PER_MINUTE=30
      - LOG_LEVEL=info
    volumes:
      - messages_uploads:/app/uploads
      - messages_logs:/app/logs
    restart: unless-stopped
    # ORDEM DE BOOT (corrigido 2026-09-15): este servico e um SATELITE do schema.
    # Suas 5 migrations fazem `ALTER TABLE "conversations"` e o codigo consulta
    # `message_servers` no boot — tabelas criadas pelas migrations do BACKEND
    # (digiurban-vps, docker/startup.sh). Sem esperar o `digiurban` ficar healthy,
    # em banco vazio ele quebra com 42P01 e o Prisma trava tudo com P3009.
    # Esta e a direcao CORRETA da dependencia: antes era o `digiurban` que
    # esperava por este container, o que formava um deadlock circular.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      digiurban:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # MÓDULO: digiurban-prices — Pesquisa de Preços Públicos
  # ─────────────────────────────────────────────────────────────
  # CompreFace removido: reconhecimento facial usa face-api.js no browser
  # + cosine similarity no PostgreSQL. Não há chamadas ao CompreFace no código.

  ultrazend-face:
    # Otimizacao VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P0-4): a imagem vem PRONTA do
    # GHCR, construida pelo GitHub Actions. A VPS so faz `pull`. O bloco `build`
    # permanece apenas como fallback manual (docker compose build) em emergencia.
    image: ghcr.io/fernandinhomartins40/digiurban-face:${RELEASE:-latest}
    build:
      context: ./ultrazend-face-server
      dockerfile: Dockerfile
    container_name: ultrazend-face
    # Otimizacao VPS (2026-09-14): SEM isto o driver json-file cresce ILIMITADO
    # ate encher o disco (a VPS esta a 84%). 3 arquivos x 10MB = teto de 30MB/container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Otimização VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P1-1): VPS COMPARTILHADA com ~30
    # aplicações — sem mem_limit um vazamento aqui derruba as outras. Valor = ~3x o
    # consumo MEDIDO (37 MiB) em produção, com folga para picos fora do heap (Sharp/Chromium).
    mem_limit: 384m
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1): `mem_limit` impedia que a app
    # comesse toda a RAM, mas NADA impedia que consumisse os 4 vCPU da VPS compartilhada
    # — que foi o incidente que motivou esta auditoria. `cpus` e TETO, nao reserva: a soma
    # dos tetos (6.0) excede os 4 vCPU de proposito, para nao particionar a maquina.
    # Justificativa deste valor: MAIOR consumidor medido (11.75%) — teto e essencial aqui.
    # `pids_limit` barra fork bomb / vazamento de processos.
    cpus: 1.0
    pids_limit: 256
    ports:
      - "9006:9006"
    environment:
      - NODE_ENV=production
      - PORT=9006
      # Otimização VPS (P1-2): heap do V8 ABAIXO do mem_limit, deixando margem para
      # memória fora do heap (Sharp, buffers, Chromium). Sem isto o V8 cresce até
      # bater no limite do container e morrer por OOM em vez de fazer GC.
      - NODE_OPTIONS=--max-old-space-size=256
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - DIGIURBAN_API_URL=http://digiurban-vps:3001/api
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - FACE_PLATFORM_SERVICE_TOKEN=${FACE_PLATFORM_SERVICE_TOKEN:-ultrazend-face-service-token}
      - FACE_PLATFORM_STORAGE_PATH=/app/uploads/face-platform
      - COMPREFACE_API_URL=
      - COMPREFACE_API_KEY=
      - FACE_LIVENESS_PROVIDER=${FACE_LIVENESS_PROVIDER:-guided-live-session}
      - SILENT_FACE_LIVENESS_API_URL=${SILENT_FACE_LIVENESS_API_URL:-}
      - SILENT_FACE_LIVENESS_API_TOKEN=${SILENT_FACE_LIVENESS_API_TOKEN:-}
      - FACE_REQUIRE_SERVER_LIVENESS=${FACE_REQUIRE_SERVER_LIVENESS:-false}
      - FACE_LIVENESS_TIMEOUT_MS=${FACE_LIVENESS_TIMEOUT_MS:-12000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - UPLOAD_DIR=/app/uploads
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=300
      - LOG_LEVEL=info
    volumes:
      - face_uploads:/app/uploads
      - face_logs:/app/logs
    restart: unless-stopped
    # ORDEM DE BOOT (corrigido 2026-09-15): satelite do schema, como o
    # ultrazend-messages — le tabelas criadas pelas migrations do backend.
    # Espera o `digiurban` para nao consultar um banco ainda sem schema.
    depends_on:
      postgres:
        condition: service_healthy
      digiurban:
        condition: service_healthy
    networks:
      - digiurban_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9006/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  digiurban:
    # Otimizacao VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P0-4): a imagem vem PRONTA do
    # GHCR, construida pelo GitHub Actions. A VPS so faz `pull`. O bloco `build`
    # permanece apenas como fallback manual (docker compose build) em emergencia.
    image: ghcr.io/fernandinhomartins40/digiurban-app:${RELEASE:-latest}
    build:
      context: .
      dockerfile: digiurban/Dockerfile
      args:
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-0}
        - CACHE_BUST=${CACHE_BUST:-0}
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
        - NEXT_PUBLIC_MESSAGES_API_URL=${NEXT_PUBLIC_MESSAGES_API_URL:-/messages-api}
        - NEXT_PUBLIC_MESSAGES_WS_URL=${NEXT_PUBLIC_MESSAGES_WS_URL:-wss://digiurban.com.br}
        # Domínio base p/ a troca de município (MunicipioSwitcher) montar subdomínios
        - NEXT_PUBLIC_TENANT_BASE_DOMAIN=${NEXT_PUBLIC_TENANT_BASE_DOMAIN:-digiurban.com.br}
    container_name: digiurban-vps
    # Otimizacao VPS (2026-09-14): SEM isto o driver json-file cresce ILIMITADO
    # ate encher o disco (a VPS esta a 84%). 3 arquivos x 10MB = teto de 30MB/container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Otimização VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P1-1): VPS COMPARTILHADA com ~30
    # aplicações — sem mem_limit um vazamento aqui derruba as outras. Valor = ~3x o
    # consumo MEDIDO (250 MiB) em produção, com folga para picos fora do heap (Sharp/Chromium).
    mem_limit: 1g
    # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A1): `mem_limit` impedia que a app
    # comesse toda a RAM, mas NADA impedia que consumisse os 4 vCPU da VPS compartilhada
    # — que foi o incidente que motivou esta auditoria. `cpus` e TETO, nao reserva: a soma
    # dos tetos (6.0) excede os 4 vCPU de proposito, para nao particionar a maquina.
    # Justificativa deste valor: 3 processos (nginx+backend+frontend) + picos de Chromium/PDF.
    # `pids_limit` barra fork bomb / vazamento de processos.
    cpus: 2.0
    pids_limit: 512
    ports:
      - "3060:80"   # Porta EXTERNA 3060 -> Porta INTERNA 80 (Nginx)
    environment:
      # Node.js
      - NODE_ENV=production

      # Backend (porta interna 3001)
      - PORT=3001
      - BACKEND_PORT=3001
      # Otimização VPS (P1-2): este container roda backend+frontend sob supervisord,
      # que repassa apenas as variáveis da sua allowlist `environment=`. O limite de
      # heap de CADA processo é definido em docker/supervisord.conf (384m backend +
      # 256m frontend), não aqui — declarar NODE_OPTIONS neste ponto não teria efeito.

      # Frontend (porta interna 3000)
      - FRONTEND_PORT=3000
      # NEXT_PUBLIC_API_URL é setado em BUILD TIME no Dockerfile (linha 40)

      # Build timestamp for cache busting
      - BUILD_TIMESTAMP=${BUILD_TIMESTAMP:-0}

      # Database PostgreSQL
      - DATABASE_URL=${DATABASE_URL}

      # Redis
      - REDIS_URL=redis://redis:6379

      # JWT
      - JWT_SECRET=${JWT_SECRET:-digiurban-super-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      - JWT_ADMIN_EXPIRES_IN=8h
      - JWT_CITIZEN_EXPIRES_IN=30d

      # CORS (ambos domínios com e sem www)
      - FRONTEND_URL=https://digiurban.com.br
      - CORS_ORIGIN=https://digiurban.com.br
      - ALLOWED_ORIGINS=https://www.digiurban.com.br,https://digiurban.com.br,http://www.digiurban.com.br,http://digiurban.com.br,http://72.60.10.108:3060,http://localhost:3060

      # Tenants
      - DEFAULT_TENANT=demo
      # Identidade do tenant migrado do modo single-tenant (linha 'tenant-default'
      # criada pela migration 20260707120000_add_tenants_table).
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-tenant-default}
      # Multi-tenant por subdomínio: {slug}.digiurban.com.br → tenant do slug.
      # Sem esta variável, todo subdomínio cai no tenant default.
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-digiurban.com.br}
      # Hosts que resolvem para o tenant default (domínio raiz single-tenant).
      # ⚠️ Antes de ligar TENANT_STRICT_HOST, inclua aqui TODO host legítimo
      # que não seja subdomínio/domínio de tenant (ex.: o IP do VPS).
      - TENANT_DEFAULT_HOSTS=${TENANT_DEFAULT_HOSTS:-digiurban.com.br,www.digiurban.com.br,72.60.10.108}

      # ── Hardening multi-tenant (Fase 2 do plano 2026-07-13) ──────────────
      # Onda 1 (LIGADO por padrão): JWT sem claim de tenant (sessão anterior à
      # atualização) exige novo login — o login novo emite o claim.
      - TENANT_REQUIRE_TOKEN_CLAIM=${TENANT_REQUIRE_TOKEN_CLAIM:-1}
      # Onda 1b (ligar após conferir TENANT_DEFAULT_HOSTS acima): host
      # desconhecido deixa de cair no default e recebe 503 TENANT_UNRESOLVED.
      - TENANT_STRICT_HOST=${TENANT_STRICT_HOST:-0}
      # Onda 2 (ligar quando a telemetria de fail-soft zerar por alguns dias):
      # operação Prisma/upload sem contexto de tenant LANÇA erro.
      - TENANT_STRICT=${TENANT_STRICT:-0}
      # RLS armado: DATABASE_URL deve usar o role NÃO-superuser digiurban_app
      # (backend/scripts/setup-app-role.sql). Migrations continuam com a
      # credencial elevada via MIGRATE_DATABASE_URL (usada só no startup.sh).
      - MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL:-}

      # Service Token (para Messages Server)
      - DIGIURBAN_SERVICE_TOKEN=${MESSAGES_SERVICE_TOKEN:-ultrazend-messages-service-token}
      - FACE_PLATFORM_API_URL=${FACE_PLATFORM_API_URL:-http://ultrazend-face:9006}
      - FACE_PLATFORM_SERVICE_TOKEN=${FACE_PLATFORM_SERVICE_TOKEN:-ultrazend-face-service-token}

      # Logs
      - LOG_LEVEL=info
      - LOGS_DIR=/app/logs

      # Uploads
      - UPLOAD_BASE_PATH=/app/uploads

      # Backups
      - BACKUPS_DIR=/app/backups

      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

      # Módulo de IA Centralizada (proxy interno)
      # IA LOCAL REMOVIDA (2026-09-14): llamacpp e digiurban-ai sairam do compose.
      # A IA passa a ser externa (API DeepSeek, com creditos por municipio).
      # Enquanto a integracao nao entra, o chat com IA fica INDISPONIVEL --
      # estas URLs apontam para um servico que nao existe mais.
      # - AI_API_URL=http://digiurban-ai:9004/api/v1
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-digiurban-ai-service-token}
      - AI_PROXY_TIMEOUT_MS=90000

    volumes:
      - digiurban_uploads:/app/uploads
      - digiurban_logs:/app/logs
      - digiurban_backups:/app/backups
    restart: unless-stopped
    # ORDEM DE BOOT (corrigido 2026-09-15): o `digiurban` NAO pode depender dos
    # satelites. Ele e o DONO do schema — suas migrations (docker/startup.sh)
    # criam `conversations`, `message_servers` e as demais ~213 tabelas que o
    # ultrazend-messages precisa para ficar healthy.
    #
    # A declaracao anterior (`ultrazend-messages: service_healthy`) era um
    # deadlock circular que so aparecia com banco VAZIO — o caso do reset da VPS
    # em 2026-09-14:
    #   digiurban espera messages ficar healthy
    #   -> messages roda migrate deploy num banco sem `conversations` (42P01)
    #   -> Prisma marca a migration como falha (P3009) e o container nunca fica healthy
    #   -> digiurban fica preso em `Created` e as tabelas nunca sao criadas
    # Com banco ja povoado o bug era invisivel, porque as tabelas ja existiam.
    #
    # A dependencia correta e a INVERSA, declarada em `ultrazend-messages`:
    # o satelite espera o dono do schema.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ultrazend-smtp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - digiurban_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  llamacpp_models:
    driver: local
  digiurban_uploads:
    driver: local
  digiurban_logs:
    driver: local
  digiurban_backups:
    driver: local
  smtp_data:
    driver: local
  smtp_logs:
    driver: local
  messages_uploads:
    driver: local
  messages_logs:
    driver: local
  face_uploads:
    driver: local
  face_logs:
    driver: local
  # opensearch_data: removed (Pesquisa de Preços)
  # prices_uploads: removed (Pesquisa de Preços)
  # flow_uploads: removed (Processos Internos)
  # flow_logs: removed (Processos Internos)
  # ai_logs:  # orfao: digiurban-ai removido (IA local -> API DeepSeek)

networks:
  digiurban_network:
    driver: bridge
