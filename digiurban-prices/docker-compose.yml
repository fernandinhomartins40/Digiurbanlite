version: '3.9'

# ─────────────────────────────────────────────
# Docker Compose para desenvolvimento local
# digiurban-prices + dependências isoladas
# ─────────────────────────────────────────────

services:

  # ─── PostgreSQL (isolado para dev) ───────────
  postgres:
    image: postgres:15-alpine
    container_name: prices-postgres
    environment:
      POSTGRES_USER: digiurban
      POSTGRES_PASSWORD: digiurban
      POSTGRES_DB: digiurban
    ports:
      - "5433:5432"
    volumes:
      - prices_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiurban"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prices_network

  # ─── OpenSearch ───────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: prices-opensearch
    environment:
      - cluster.name=prices-cluster
      - node.name=prices-node
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin@12345!
    ports:
      - "9200:9200"
    volumes:
      - prices_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - prices_network

  # ─── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: prices-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prices_network

  # ─── API Principal ────────────────────────────
  prices-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prices-api
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=9002
      - DATABASE_URL=postgresql://digiurban:digiurban@postgres:5432/digiurban
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
    ports:
      - "9002:9002"
    volumes:
      - prices_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prices_network
    restart: unless-stopped

volumes:
  prices_postgres_data:
  prices_opensearch_data:
  prices_uploads:

networks:
  prices_network:
    driver: bridge
