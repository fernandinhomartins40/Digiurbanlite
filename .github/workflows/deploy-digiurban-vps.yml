name: Deploy DigiUrban to VPS

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          GIT_TOKEN: ${{ github.token }}
        with:
          host: digiurban.com.br
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 45m
          command_timeout: 45m
          envs: GIT_TOKEN
          script: |
            set -e

            echo "=== Iniciando Deploy DigiUrban ==="

            # DiretA3rio da aplicaAAo
            APP_DIR="/root/digiurban"

            # Parar containers existentes
            echo "Parando containers existentes..."
            cd $APP_DIR
            docker-compose -f docker-compose.vps.yml down || true

            # Remover containers A3rfAos que possam estar em conflito
            echo "Removendo containers A3rfAos..."
            docker stop ultrazend-smtp 2>/dev/null || true
            docker rm ultrazend-smtp 2>/dev/null || true
            docker stop ultrazend-messages 2>/dev/null || true
            docker rm ultrazend-messages 2>/dev/null || true
            docker stop digiurban-postgres 2>/dev/null || true
            docker rm digiurban-postgres 2>/dev/null || true
            docker stop digiurban-redis 2>/dev/null || true
            docker rm digiurban-redis 2>/dev/null || true
            docker stop digiurban-ai 2>/dev/null || true
            docker rm digiurban-ai 2>/dev/null || true

            # ===== ATUALIZAR CADIGO DO GITHUB =====
            echo "=== Atualizando cA3digo do GitHub ==="

            # Fazer backup do .env se existir
            if [ -f ".env" ]; then
              cp .env .env.backup
              echo "a Backup do .env criado"
            fi

            # Configurar autenticaAAo Git (funciona tanto para repo pAoblico quanto privado)
            REPO_URL="https://github.com/fernandinhomartins40/Digiurbanlite.git"
            if [ -n "${GIT_TOKEN}" ]; then
              echo "Y Token Git detectado, configurando autenticaAAo para repo privado..."
              git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/fernandinhomartins40/Digiurbanlite.git"
            else
              echo "a1i  Sem token Git, usando acesso pAoblico..."
              git remote set-url origin "${REPO_URL}"
            fi

            # Garantir que estamos no branch main
            git checkout main || git checkout -b main origin/main

            # Fazer fetch e reset hard para sincronizar com origin/main
            echo "Y Fazendo fetch do origin/main..."
            git fetch origin main --prune --force

            echo "YS Status antes da sincronizaAAo:"
            echo "Commit local:  $(git rev-parse HEAD)"
            echo "Commit origin: $(git rev-parse origin/main)"

            # Stash de qualquer alteraAAo local
            git add -A 2>/dev/null || true
            git stash push -u -m "Auto-stash antes do deploy $(date +%Y%m%d_%H%M%S)" 2>/dev/null || true

            # ForAar sincronizaAAo com origin/main
            echo "Y Sincronizando com origin/main..."
            git reset --hard origin/main
            git clean -fdx -e .env -e .env.backup

            # Restaurar .env se foi deletado
            if [ ! -f ".env" ] && [ -f ".env.backup" ]; then
              cp .env.backup .env
              echo "a .env restaurado do backup"
            fi

            echo "a... CA3digo atualizado para commit: $(git rev-parse HEAD)"
            echo "Y Asltimos 3 commits:"
            git log --oneline -3

            if [ ! -f "$APP_DIR/scripts/vps-deploy-lib.sh" ]; then
              echo "ERRO: scripts/vps-deploy-lib.sh nao encontrado"
              exit 1
            fi

            . "$APP_DIR/scripts/vps-deploy-lib.sh"
            ensure_vm_max_map_count 262144

            # Criar arquivo .env
            echo "Criando arquivo .env..."
            write_vps_env_file ".env" ".env.backup"

            # Validar variAveis crAticas para interpolaAAo do docker-compose
            echo "Validando variAveis crAticas do .env..."
            for required_var in FLOW_SERVICE_TOKEN MESSAGES_SERVICE_TOKEN AI_SERVICE_TOKEN; do
              if ! grep -q "^${required_var}=.\\+" .env; then
                echo "a ERRO: ${required_var} ausente no .env"
                exit 1
              fi
            done
            echo "a... VariAveis crAticas presentes no .env"

            # Remover arquivos .db SQLite antigos (nAo usamos mais)
            echo "Removendo arquivos .db do cA3digo-fonte..."
            find . -name "*.db" -type f ! -path "*/node_modules/*" -delete || true
            find . -name "*.db-*" -type f ! -path "*/node_modules/*" -delete || true
            echo "a... Arquivos .db removidos"

            # ===== LIMPEZA SEGURA: Remover APENAS imagens antigas (PRESERVAR volumes!) =====
            echo "=== Limpando recursos antigos de forma segura ==="

            # Listar volumes ANTES da limpeza (para garantir que nAo serAo tocados)
            echo "Y Volumes existentes (serAo preservados):"
            docker volume ls | grep -E "postgres_data|digiurban_uploads|messages_uploads|smtp_data|digiurban_backups" || echo "Nenhum volume encontrado ainda"

            # Limpar containers parados (seguro - nAo afeta volumes)
            echo "Y1 Removendo containers parados..."
            docker container prune -f || true

            # ===== LIMPEZA NUCLEAR DE CACHE =====
            echo "=== Y LIMPEZA NUCLEAR DE CACHE DOCKER ==="

            # 1. Remover TODAS as imagens relacionadas ao DigiUrban
            echo "Yi  Removendo TODAS as imagens do DigiUrban..."
            docker images | grep -i digiurban | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            docker images | grep -i backend-builder | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            docker images | grep -i frontend-builder | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            docker images | grep -i runner | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true

            # 2. Remover imagens base do Node.js (forAa download novo)
            echo "Yi  Removendo imagens base do Node.js..."
            docker images | grep "node.*18-bookworm-slim" | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true

            # 3. Limpar build cache do Docker
            echo "Yi  Limpando build cache do Docker..."
            docker builder prune -af --filter "until=1h" || true

            # 4. Remover imagens A3rfAs (dangling)
            echo "Yi  Removendo imagens A3rfAs..."
            docker image prune -af || true

            # 5. Verificar que volumes AINDA existem apA3s limpeza
            echo "a... Verificando integridade dos volumes apA3s limpeza:"
            docker volume ls | grep -E "postgres_data|digiurban_uploads|messages_uploads|smtp_data|digiurban_backups" || echo "as i  AVISO: Alguns volumes nAo foram encontrados!"

            # 6. Gerar BUILD_TIMESTAMP Aonico
            export BUILD_TIMESTAMP=$(date +%s%N)
            export CACHE_BUST=$(echo $RANDOM | md5sum | head -c 20)
            echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}"
            echo "CACHE_BUST=${CACHE_BUST}"

            # 7. ForAar pull das imagens base
            echo "Y ForAando pull de imagens base..."
            docker pull node:18-bookworm-slim

            # ===== VALIDAAAO PRA-BUILD: Verificar arquivos crAticos =====
            echo "=== Validando arquivos crAticos antes do build ==="

            # Validar estrutura de arquivos backend
            if [ ! -f "digiurban/backend/src/routes/citizen-services.ts" ]; then
              echo "a ERRO: citizen-services.ts nAo encontrado!"
              exit 1
            fi
            echo "a citizen-services.ts encontrado"

            if [ ! -f "digiurban/backend/src/index.ts" ]; then
              echo "a ERRO: index.ts nAo encontrado!"
              exit 1
            fi
            echo "a index.ts encontrado"

            # Verificar se o index.ts registra a rota citizen-services
            if ! grep -q "citizen-services" digiurban/backend/src/index.ts; then
              echo "a ERRO: index.ts nAo registra a rota citizen-services!"
              exit 1
            fi
            echo "a Rota citizen-services registrada no index.ts"

            # Validar tsconfig.docker.json
            if [ ! -f "digiurban/backend/tsconfig.docker.json" ]; then
              echo "a ERRO: tsconfig.docker.json nAo encontrado!"
              exit 1
            fi
            echo "a tsconfig.docker.json encontrado"

            # Verificar conteAodo do tsconfig.docker.json
            echo "Y ConteAodo do tsconfig.docker.json:"
            cat digiurban/backend/tsconfig.docker.json

            # Validar estrutura shared
            if [ ! -d "digiurban/shared" ]; then
              echo "a ERRO: DiretA3rio shared nAo encontrado!"
              exit 1
            fi
            echo "a DiretA3rio shared encontrado"

            echo "Y Estrutura do diretA3rio shared:"
            ls -la digiurban/shared/

            # Validar arquivos shared crAticos
            if [ ! -f "digiurban/shared/types/family.types.ts" ]; then
              echo "a ERRO: family.types.ts nAo encontrado!"
              exit 1
            fi
            echo "a family.types.ts encontrado"

            echo "=== a... Todos os arquivos crAticos validados ==="

            # ===== VALIDAAAO DO DOCKERFILE =====
            echo "=== Y VALIDAAAO DO DOCKERFILE ==="

            # Gerar hash do Dockerfile para garantir que estamos usando a versAo correta
            DOCKERFILE_HASH=$(md5sum digiurban/Dockerfile | awk '{print $1}')
            echo "Hash do Dockerfile: ${DOCKERFILE_HASH}"

            echo "Verificando linhas crAticas do Dockerfile:"
            echo "--- Linha 37 (COPY shared):"
            sed -n '37p' digiurban/Dockerfile
            echo "--- Linha 50 (DATABASE_URL):"
            sed -n '50p' digiurban/Dockerfile
            echo "--- Linha 52 (Build command):"
            sed -n '52p' digiurban/Dockerfile

            # Verificar se linha 52 contAm o comando correto
            if grep -q "npx tsc -p tsconfig.docker.json" digiurban/Dockerfile; then
              echo "a... Dockerfile contAm comando correto (npx tsc -p tsconfig.docker.json)"
            else
              echo "a ERRO: Dockerfile NAO contAm comando correto!"
              echo "ConteAodo da linha 52:"
              sed -n '52p' digiurban/Dockerfile
              exit 1
            fi

            # ===== BUILD SEM CACHE COM MAsLTIPLAS GARANTIAS =====
            echo "=== Y  CONSTRUINDO IMAGEM (BUILD COMPLETO SEM CACHE) ==="

            # Adicionar CACHE_BUST como build arg adicional
            docker-compose -f docker-compose.vps.yml build \
              --no-cache \
              --pull \
              --progress=plain \
              --build-arg BUILD_TIMESTAMP=${BUILD_TIMESTAMP} \
              --build-arg CACHE_BUST=${CACHE_BUST} \
              --build-arg BUILDKIT_INLINE_CACHE=0

            # Parar containers existentes antes de iniciar
            echo "Parando containers existentes..."
            docker-compose -f docker-compose.vps.yml down || true

            # Iniciar container
            echo "Iniciando container..."
            echo "Iniciando infraestrutura base..."
            docker-compose -f docker-compose.vps.yml up -d \
              postgres \
              redis \
              ultrazend-smtp \
              llamacpp \
              ultrazend-messages \
              digiurban-flow \
              digiurban-ai \
              digiurban-opensearch

            wait_for_container_health digiurban-postgres 30 5
            wait_for_container_health digiurban-redis 30 5
            wait_for_container_health ultrazend-smtp 30 5
            wait_for_container_health digiurban-llamacpp 60 10
            wait_for_http_ready http://127.0.0.1:8080/health 60 10
            wait_for_container_health ultrazend-messages 30 5
            wait_for_container_health digiurban-flow 30 5
            wait_for_container_health digiurban-ai 30 5
            wait_for_container_health digiurban-opensearch 36 10

            echo "Iniciando modulo de precos..."
            docker-compose -f docker-compose.vps.yml up -d digiurban-prices
            wait_for_container_health digiurban-prices 36 10

            echo "Iniciando aplicacao principal..."
            docker-compose -f docker-compose.vps.yml up -d digiurban
            wait_for_container_health digiurban-vps 36 10

            # Aguardar PostgreSQL e aplicaAAo iniciarem
            echo "Aguardando containers iniciarem..."

            # ===== EXECUTAR SEEDS DOS MICRO SISTEMAS =====
            echo "=== Executando seeds dos Micro Sistemas ==="
            docker exec digiurban-vps sh -c "cd /app/backend && npm run db:seed:deploy-safe" || echo "as i  Seed seguro falhou mas continuando deploy"
            echo "a... Seeds executados"

            # ===== EXECUTAR SEED DOS FLUXOS DO BOT =====
            echo "=== Populando fluxos do sistema de bot ==="
            docker exec digiurban-vps node /app/backend/dist/scripts/seed-flows.js || echo "as i  Seed de fluxos falhou mas continuando deploy"
            echo "a... Fluxos do bot populados"

            # ===== VALIDAR LLAMA.CPP =====
            echo "=== Validando llama.cpp com Qwen3 1.7B ==="
            docker logs digiurban-llamacpp --tail=80 || true
            curl -fsS http://127.0.0.1:8080/health >/dev/null || curl -fsS http://127.0.0.1:8080/v1/models >/dev/null

            echo "Y Reiniciando digiurban-ai para reaplicar warmup..."
            docker-compose -f docker-compose.vps.yml restart digiurban-ai
            wait_for_container_health digiurban-ai 30 5
            echo "Y Reiniciando backend para aplicar configuraAAes de IA..."
            docker-compose -f docker-compose.vps.yml restart digiurban
            wait_for_container_health digiurban-vps 36 10

            echo "a... llama.cpp configurado com sucesso!"

            # ===== VERIFICAR MIGRATIONS DO ULTRAZEND MESSAGES =====
            echo "=== Verificando migrations do UltraZend Messages ==="
            docker logs ultrazend-messages 2>&1 | grep -i "prisma" || echo "Logs do Prisma migrations"

            # Verificar se as tabelas foram criadas
            echo "=== Verificando tabelas do UltraZend Messages no banco ==="
            docker exec digiurban-postgres psql -U digiurban -d digiurban -c "\dt message_*" || echo "as i  Tabelas ainda nAo criadas"

            # ===== DIAGNASTICO: Verificar se backend estA crashando =====
            echo "=== Verificando status do backend no supervisord ==="
            docker exec digiurban-vps supervisorctl status || true

            echo "=== Logs completos do backend (stdout + stderr) ==="
            docker exec digiurban-vps cat /var/log/backend.stdout.log || echo "Nenhum log stdout"
            docker exec digiurban-vps cat /var/log/backend.stderr.log || echo "Nenhum log stderr"

            # Verificar status
            echo "Verificando status dos containers..."
            docker-compose -f docker-compose.vps.yml ps

            # Verificar logs do PostgreSQL
            echo "=== Logs do PostgreSQL ==="
            docker logs digiurban-postgres --tail=20

            # Verificar logs da aplicaAAo
            echo "=== Logs da AplicaAAo ==="
            docker logs digiurban-vps --tail=100

            # Verificar se container estA rodando
            if ! docker ps | grep -q digiurban-vps; then
              echo "a Container digiurban-vps nAo estA rodando!"
              echo "=== Logs completos do container ==="
              docker logs digiurban-vps
              exit 1
            fi

            # ===== VALIDAAAO PAS-BUILD: Verificar rota crAtica =====
            echo "=== Validando rotas crAticas no container ==="

            # Verificar se o arquivo compilado existe
            if ! docker exec digiurban-vps test -f /app/backend/dist/routes/citizen-services.js; then
              echo "a ERRO: citizen-services.js nAo foi compilado no container!"
              echo "=== Listando arquivos em dist/routes ==="
              docker exec digiurban-vps ls -la /app/backend/dist/routes/ || true
              exit 1
            fi
            echo "a citizen-services.js compilado no container"

            # Verificar se o index.js registra a rota
            if ! docker exec digiurban-vps grep -q "citizen-services" /app/backend/dist/index.js; then
              echo "a ERRO: Rota citizen-services nAo registrada no index.js compilado!"
              exit 1
            fi
            echo "a Rota citizen-services registrada no index.js compilado"

            # Aguardar backend inicializar e buscar logs de carregamento de rotas
            echo "=== Aguardando backend carregar rotas (10s) ==="
            sleep 10

            echo "=== Logs de carregamento de rotas do backend ==="
            docker logs digiurban-vps 2>&1 | grep -A 2 -B 2 "citizen-services" || echo "as i  Nenhum log de citizen-services encontrado"

            echo "=== Verificando se houve erro no carregamento ==="
            if docker logs digiurban-vps 2>&1 | grep -q "a citizen-services"; then
              echo "a ERRO: citizen-services falhou ao carregar!"
              echo "=== Logs completos ==="
              docker logs digiurban-vps --tail=100
              exit 1
            fi
            echo "a Nenhum erro no carregamento de citizen-services"

            # Verificar health
            echo "Verificando health check..."
            for i in {1..15}; do
              if curl -f http://localhost:3060/health; then
                echo "a... DigiUrban estA rodando na porta 3060!"

                # Validar rota citizen-services estA acessAvel
                echo "=== Validando rota /api/citizen/services ==="
                if curl -f http://localhost:3060/api/citizen/services; then
                  echo "a... Rota /api/citizen/services estA acessAvel!"
                  exit 0
                else
                  echo "a Rota /api/citizen/services retornou erro!"
                  echo "=== Logs do backend ==="
                  docker logs digiurban-vps --tail=50
                  exit 1
                fi
              fi
              echo "Tentativa $i/15 falhou, aguardando 10s..."

              # Mostrar logs a cada 3 tentativas
              if [ $((i % 3)) -eq 0 ]; then
                echo "=== Logs recentes ==="
                docker logs digiurban-vps --tail=30
              fi

              sleep 10
            done

            echo "as i  Health check falhou apA3s 10 tentativas"
            echo "Logs completos:"
            docker-compose -f docker-compose.vps.yml logs
            exit 1

      - name: Verify Deployment
        if: success()
        run: |
          echo "a... Deploy concluAdo com sucesso!"
          echo "Y DigiUrban disponAvel em: https://www.digiurban.com.br"
          echo "Y Acesso alternativo: http://72.60.10.108:3060"
          echo "YS Health check: http://72.60.10.108:3060/health"
