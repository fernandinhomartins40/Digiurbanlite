name: Build and Push Images (GHCR)

# Otimizacao VPS (docs/VPS-OPTIMIZATION-AUDIT.md, P0-4)
# ====================================================
# Antes: o deploy rodava em `runs-on: self-hosted` (a PROPRIA VPS de producao) e
# executava `docker-compose build --no-cache --pull`, ou seja: npm install do
# backend + do frontend, tsc, next build e download de 968 MB de Chromium em 4
# vCPU compartilhados por 93 containers (load medido 6.5, steal time 13.8%).
#
# Agora: este workflow constroi as imagens em runners GitHub-hosted e publica no
# GHCR. A VPS apenas autentica, faz `pull` e sobe os containers.
#
# As 5 imagens sao construidas EM PARALELO (matrix), cada uma com cache de
# camadas no proprio GHCR (`cache-from`/`cache-to`), entao builds seguintes
# reaproveitam as dependencias em vez de recompilar do zero.

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# CONCORRENCIA (2026-09-15): sem isto, pushes em sequencia disparavam deploys
# EMPILHADOS — dois jobs recriando os mesmos containers ao mesmo tempo, cada um
# puxando ~5 GB de imagens e disputando os 4 vCPU da VPS. Foi uma das causas do
# acumulo de lixo e da lentidao observados.
#
# Agora so ha um deploy por vez. `cancel-in-progress: true` porque em deploy o
# que importa e o ULTIMO commit: se chegou codigo novo, terminar o anterior e
# desperdicio — o estado final seria sobrescrito de qualquer forma.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: fernandinhomartins40

jobs:
  # Testes automaticos (sem banco): DigiBot (entendimento sem IA, autoatendimento,
  # palavras reservadas) e demais unitarios. Falhou -> nao implanta.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            digiurban/backend/package-lock.json
            ultrazend-messages-server/package-lock.json
            ultrazend-face-server/package-lock.json
      - name: Backend - testes unitarios
        working-directory: digiurban/backend
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npx jest __tests__/unit --ci
      - name: Servidor do bot - testes
        working-directory: ultrazend-messages-server
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npx jest --ci
      - name: Biometria - regras de decisao e tipos
        working-directory: ultrazend-face-server
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npx tsc --noEmit
          npm test

  build:
    runs-on: ubuntu-latest
    strategy:
      # Uma imagem quebrada nao deve impedir a publicacao das outras: o deploy
      # valida a presenca das tags antes de subir.
      fail-fast: false
      matrix:
        include:
          - name: digiurban-app
            context: .
            dockerfile: digiurban/Dockerfile
          - name: digiurban-messages
            context: ./ultrazend-messages-server
            dockerfile: ./ultrazend-messages-server/Dockerfile
          - name: digiurban-face
            context: ./ultrazend-face-server
            dockerfile: ./ultrazend-face-server/Dockerfile
          - name: digiurban-face-engine
            context: ./ultrazend-face-engine
            dockerfile: ./ultrazend-face-engine/Dockerfile
          - name: digiurban-doc-engine
            context: ./ultrazend-doc-engine
            dockerfile: ./ultrazend-doc-engine/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Duas tags: `latest` (usada pelo compose por padrao) e o SHA do commit,
          # que permite rollback para uma versao exata (RELEASE=<sha>).
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          # Cache de camadas no proprio registry — substitui o cache local que era
          # destruido a cada deploy na VPS.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:buildcache,mode=max
          # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, A5): o buildx anexa por padrao
          # manifestos de provenance/SBOM a cada imagem. Isso vira manifest-list com
          # camadas extras de attestation — peso e tempo de pull que a VPS paga em TODO
          # deploy, sem uso operacional aqui (nao ha verificacao de assinatura no fluxo).
          # Confirmado local: o build gera "exporting attestation manifest" por imagem.
          provenance: false
          sbom: false
          # NEXT_PUBLIC_* sao lidos em BUILD TIME pelo Next.js (ver digiurban/Dockerfile),
          # por isso precisam estar aqui e nao apenas no compose.
          build-args: |
            BUILD_TIMESTAMP=${{ github.run_id }}
            CACHE_BUST=${{ github.sha }}
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_MESSAGES_API_URL=/messages-api
            NEXT_PUBLIC_MESSAGES_WS_URL=wss://digiurban.com.br
            NEXT_PUBLIC_TENANT_BASE_DOMAIN=digiurban.com.br

  deploy:
    # Só implanta se TODAS as imagens foram publicadas com sucesso.
    needs: [build, tests]
    runs-on: self-hosted
    steps:
      - name: Deploy to VPS (pull only, sem build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE: ${{ github.sha }}
        run: |
          set -e
          APP_DIR="/opt/digiurban"
          cd "$APP_DIR"

          echo "=== Sincronizando codigo (compose, scripts, sql) ==="
          if [ -f ".env" ]; then cp .env .env.backup; fi
          # O clone em /opt/digiurban nao tem credencial valida (o GitHub removeu
          # auth por senha). Buscamos via URL autenticada com o GITHUB_TOKEN desta
          # execucao, passada inline para NAO ficar gravada no .git/config.
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --force "$REMOTE_URL" "+refs/heads/main:refs/remotes/origin/main"
          git reset --hard origin/main
          git clean -fdx -e .env -e .env.backup
          if [ ! -f ".env" ] && [ -f ".env.backup" ]; then cp .env.backup .env; fi

          . "$APP_DIR/scripts/vps-deploy-lib.sh"
          write_vps_env_file ".env" ".env.backup"

          # Subdominios de municipio (palmital.digiurban.com.br...) dependem do
          # curinga no nginx do HOST. Ele ja sumiu duas vezes quando outro projeto
          # da VPS foi instalado (2026-09-15: caia no aprenderia; 2026-10-01: no
          # velomail). O deploy recoloca se faltar — testa antes de aplicar e
          # nunca derruba o deploy por isso.
          HOST_NGINX="/etc/nginx/sites-available/digiurban"
          if [ -f "$HOST_NGINX" ] && ! grep -q '\*\.digiurban\.com\.br' "$HOST_NGINX"; then
            echo "=== Recolocando *.digiurban.com.br no nginx do host ==="
            cp "$HOST_NGINX" "/root/nginx-digiurban.bak-$(date +%Y%m%d%H%M%S)" || true
            sed -i 's/server_name digiurban.com.br www.digiurban.com.br/server_name digiurban.com.br www.digiurban.com.br *.digiurban.com.br/' "$HOST_NGINX"
            if nginx -t >/dev/null 2>&1; then systemctl reload nginx && echo "nginx do host recarregado"; else echo "AVISO: nginx -t falhou; revise $HOST_NGINX"; fi
          fi

          echo "=== Autenticando no GHCR ==="
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # RELEASE fixa a versao exata deste commit — permite rollback trocando o valor.
          # Otimizacao VPS (docs/PLANO-OTIMIZACAO-VPS.md, M2): remover a linha anterior antes
          # de anexar. Com `>>` puro, cada deploy acrescentava mais um `RELEASE=` ao arquivo;
          # o deploy passa a ser idempotente (sempre exatamente uma linha RELEASE=).
          # Guarda a release que estava no ar ANTES de sobrescrever: e ela que a
          # limpeza do fim preserva como rede de rollback (ver secao de limpeza).
          RELEASE_ANTERIOR=$(grep -E '^RELEASE=' .env 2>/dev/null | tail -1 | cut -d= -f2- || true)
          export RELEASE_ANTERIOR
          echo "Release anterior: ${RELEASE_ANTERIOR:-<nenhuma>}"

          sed -i '/^RELEASE=/d' .env
          echo "RELEASE=${RELEASE}" >> .env

          echo "=== Baixando imagens prontas (a VPS NAO compila) ==="
          # A conexao com o registro de imagens as vezes cai no meio ("connection reset
          # by peer") e derrubava o deploy inteiro. Tenta de novo: as camadas ja
          # baixadas ficam guardadas, entao cada tentativa continua de onde parou.
          PULL_OK=0
          for tentativa in 1 2 3 4 5; do
            if RELEASE="${RELEASE}" docker-compose -f docker-compose.vps.yml pull \
              digiurban ultrazend-messages ultrazend-face ultrazend-face-engine ultrazend-doc-engine; then
              PULL_OK=1
              break
            fi
            echo "Download das imagens falhou (tentativa ${tentativa} de 5). Nova tentativa em 20 s..."
            sleep 20
          done
          if [ "${PULL_OK}" != "1" ]; then
            echo "ERRO: nao foi possivel baixar as imagens depois de 5 tentativas."
            exit 1
          fi

          # IA LOCAL REMOVIDA (2026-09-14): llamacpp e digiurban-ai sairam do compose
          # (a IA passa a ser externa). Containers de servicos removidos NAO somem
          # sozinhos: `up -d` com lista de servicos ignora orfaos. Sem esta limpeza
          # explicita eles ficariam rodando para sempre segurando ~2.4 GB de RAM numa
          # VPS compartilhada. Idempotente: nao falha se ja nao existirem.
          # O volume llamacpp_models e PRESERVADO de proposito (modelo GGUF).
          echo "=== Removendo containers da IA local (descontinuada) ==="
          docker rm -f digiurban-llamacpp digiurban-ai 2>/dev/null || true

          # SMTP PROPRIO REMOVIDO (2026-10-05): e-mail transacional vai pelo VeloMail.
          # Mesmo motivo acima: tirar do compose nao para o container antigo, que
          # seguiria segurando as portas 25/587 da VPS.
          echo "=== Removendo servidor SMTP antigo (descontinuado) ==="
          docker rm -f ultrazend-smtp 2>/dev/null || true

          echo "=== Subindo infraestrutura (banco, cache) ==="
          RELEASE="${RELEASE}" docker-compose -f docker-compose.vps.yml up -d \
            postgres redis

          wait_for_container_health digiurban-postgres 30 5
          wait_for_container_health digiurban-redis 30 5

          # ORDEM DE BOOT (corrigido 2026-09-15): o `digiurban` sobe ANTES do
          # `ultrazend-messages`, e nao depois. Motivo: o messages-server e um
          # SATELITE do schema — suas 5 migrations fazem `ALTER TABLE "conversations"`,
          # mas quem CRIA `conversations` (e as demais ~213 tabelas) sao as migrations
          # do backend, dentro do digiurban-vps (docker/startup.sh).
          #
          # Na ordem anterior isso era um deadlock circular que so aparecia com banco
          # VAZIO (foi o caso apos o reset da VPS em 2026-09-14):
          #   1. ultrazend-messages sobe primeiro e roda migrate deploy
          #   2. banco sem `conversations` -> erro 42P01
          #   3. Prisma marca a migration como falha -> trava tudo com P3009
          #   4. wait_for_container_health ultrazend-messages estoura -> job MORRE
          #   5. o digiurban, que criaria as tabelas, NUNCA subia
          # Com banco ja povoado o bug ficava invisivel, porque as tabelas existiam.
          echo "=== Subindo aplicacao principal (migrations rodam no startup.sh) ==="
          RELEASE="${RELEASE}" docker-compose -f docker-compose.vps.yml up -d digiurban
          # 90x10s = 15 min. O valor anterior (36x10s = 6 min) era suficiente para um
          # banco ja povoado, mas NAO para o primeiro boot em banco ZERADO, onde este
          # container cria as ~213 tabelas do zero antes de responder ao healthcheck.
          wait_for_container_health digiurban-vps 90 10

          echo "=== Subindo satelites (schema ja criado pelo backend) ==="
          RELEASE="${RELEASE}" docker-compose -f docker-compose.vps.yml up -d \
            ultrazend-face-engine ultrazend-doc-engine ultrazend-messages ultrazend-face
          wait_for_container_health ultrazend-messages 30 5

          echo "=== Seeds ==="
          docker exec digiurban-vps sh -c "cd /app/backend && npm run db:seed:deploy-safe" \
            || echo "AVISO: seed seguro falhou, deploy continua"
          # fluxos do DigiBot: criados pelo proprio servidor do bot (e recriados sob demanda)

          echo "=== Validacao de seguranca: endpoints legados de plataforma = 410 ==="
          LEGACY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3060/api/super-admin/tenants || echo "000")
          echo "GET /api/super-admin/tenants -> HTTP ${LEGACY_STATUS}"
          if [ "${LEGACY_STATUS}" = "200" ]; then
            echo "ERRO DE SEGURANCA: endpoint legado respondeu 200 (deveria ser 410)"
            exit 1
          fi

          echo "=== Healthcheck final ==="
          curl -fsS http://localhost:3060/health >/dev/null && echo "OK: aplicacao respondendo"

          # LIMPEZA (corrigido 2026-09-15): `docker image prune -f` sozinho so
          # remove imagens DANGLING (sem tag). Como cada build publica tags com o
          # SHA do commit, nenhuma versao antiga era removida: em um unico dia de
          # trabalho acumularam-se 31 imagens / 10 GB (app 3 GB + messages 1 GB +
          # smtp 836 MB + face por deploy).
          #
          # Agora removemos tambem as versoes antigas DESTE projeto, preservando
          # a release atual. Escopo RESTRITO ao prefixo ghcr.io/<owner>/ — numa
          # VPS compartilhada, `prune -a` apagaria imagens de outras aplicacoes.
          # Preserva a release ATUAL e a ANTERIOR (a que os containers ainda
          # usavam antes deste deploy). A anterior e a rede de rollback: com ela
          # em disco, voltar e trocar RELEASE no .env e subir — sem rebuild e sem
          # depender do GHCR. So da terceira versao para tras e lixo de fato.
          echo "=== Limpando versoes antigas das imagens do projeto ==="
          PRESERVAR="${RELEASE} ${RELEASE_ANTERIOR:-}"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^ghcr.io/${OWNER}/" \
            | grep -v ":latest$" \
            | grep -v ":buildcache$" \
            | while read -r img; do
                tag="${img##*:}"
                manter=0
                for p in ${PRESERVAR}; do
                  [ -n "$p" ] && [ "$tag" = "$p" ] && manter=1
                done
                [ "$manter" = "0" ] && echo "$img"
              done \
            | xargs -r docker rmi 2>/dev/null || true

          docker image prune -f || true
          echo "=== Uso de disco apos limpeza ==="
          docker system df | head -3

          echo "=== Deploy concluido (RELEASE=${RELEASE}) ==="
